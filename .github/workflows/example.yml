name: Build standalone example
on:
  # Pull requests and main; a branch push without a pull request runs nothing,
  # so no commit is tested twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Render standalone example
        run: |
          quarto render example.qmd
          test -f example.html || test -f _site/example.html
      - uses: actions/upload-artifact@v7
        with:
          name: standalone-example
          path: |
            example.html
            example_files
            _site
