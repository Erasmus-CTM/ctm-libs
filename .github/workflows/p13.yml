name: P13 standalone worker
on:
  pull_request:
    paths: ['_extensions/ctm-libs/runtime/**', '_extensions/ctm-libs/lua/runtime.lua', 'tests/browser/standalone.mjs', 'tests/p13-transactions.test.cjs', 'scripts/sync-worker-core.cjs', '.github/workflows/p13.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/sync-worker-core.cjs --check
      - run: node --test tests/p13-transactions.test.cjs tests/worker.test.cjs tests/runtime-scoped-stop.test.cjs
      - run: npm install --no-save --ignore-scripts playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Real Python, endless loops, output floods, input and recovery
        run: node tests/browser/standalone.mjs > "$RUNNER_TEMP/standalone.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p13-standalone-evidence
          path: ${{ runner.temp }}/standalone.json
