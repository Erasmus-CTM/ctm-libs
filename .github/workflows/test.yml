name: ctm-libs tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pinned commits (tests/pins.json)
        id: pins
        run: jq -r 'to_entries[] | select(.value | type == "object") | "\(.key)=\(.value.commit)"' tests/pins.json >> "$GITHUB_OUTPUT"
      - name: The umbrella's review-dependencies script
        uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/ctm-assessment
          ref: ${{ steps.pins.outputs['ctm-assessment'] }}
          path: _ci/ctm-assessment
          sparse-checkout: tools/ci
          persist-credentials: false
      - name: Select explicit review dependencies (main keeps the pins)
        id: review
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 _ci/ctm-assessment/tools/ci/review-dependencies.py
      - name: ctm-checkers (installs, calls and the render fixture)
        uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/ctm-checkers
          ref: ${{ steps.review.outputs['ctm-checkers'] || steps.pins.outputs['ctm-checkers'] }}
          path: _ctm-checkers-source
          persist-credentials: false
      - run: python -m pip install 'PyYAML>=6'
      - run: python scripts/sync-feedback-defaults.py --check
      - run: python scripts/check-locales.py
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.27"
      - run: npm ci --ignore-scripts
      - name: npm test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Report failing tests as annotations
        if: failure()
        run: |
          text=$(grep -A30 'not ok' "$RUNNER_TEMP/test.log" | head -c 3500 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Failing tests::$text"
